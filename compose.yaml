version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    ports:
      - "50051:50051"
    environment:
      - GRPC_PORT=50051
      - DATABASE_URL=postgres://meow:meow@db:5432/cryptomai_db?sslmode=disable
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cryptomai-network
    image: server:latest

  db:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: meow
      POSTGRES_PASSWORD: meow
      POSTGRES_DB: cryptomai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meow -d cryptomai_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cryptomai-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - cryptomai-network

volumes:
  postgres_data: 
  rabbitmq_data:
  rabbitmq_logs:

networks:
  cryptomai-network:
    driver: bridge