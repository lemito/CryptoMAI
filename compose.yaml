version: '3.8'

services:
  db:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: meow
      POSTGRES_PASSWORD: meow
      POSTGRES_DB: cryptomai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meow -d cryptomai_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cryptomai-network

  minio:
    image: minio/minio:latest
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_STORAGE_FREE_DISK: "1%"
    volumes:
      - minio-storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - cryptomai-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 60s
      retries: 3
    networks:
      - cryptomai-network

  server:
    stdin_open: true
    tty: true
    build:
      context: .
      dockerfile: ./server/Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    ports:
      - "50051:50051"
    environment:
      - GRPC_PORT=50051
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=meow
      - DB_PASSWORD=meow
      - DB_NAME=cryptomai_db
      - DB_SSLMODE=disable
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - cryptomai-network
    image: server:latest

volumes:
  postgres_data: 
  rabbitmq_data:
  rabbitmq_logs:
  minio-storage:

networks:
  cryptomai-network:
    driver: bridge
